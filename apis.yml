name: Goyaz Silver Jewellery
description: 'Goyaz Silver Jewellery is a Hyderabad-based Indian jewellery retail brand founded in
  January 2023 by Priyanka Vemuluri, specializing in 92.5 premium and gold-plated silver jewellery that
  blends traditional Indian craftsmanship with contemporary, occasion-led design. Operating a chain of
  18 retail stores across Telangana, Andhra Pradesh and Karnataka (including Kukatpally, Punjagutta,
  Suchitra Circle, Vijayawada and Visakhapatnam), Goyaz positions gold-plated silver as an accessible
  luxury alternative to gold. In October 2025 the company raised a Rs 130 crore (~$14.6M) Series A round
  led by Norwest Venture Partners, its first institutional funding, to expand its retail footprint,
  strengthen design and manufacturing, and enhance its omnichannel experience. The company operates an
  online storefront and social commerce presence but publishes no public developer API, SDK, or
  documentation surface. This profile entered the API Evangelist network as a Norwest Venture Partners
  portfolio lead.'
